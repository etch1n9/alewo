[package]
name = "alewo"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Alewo independent Rust coding-agent harness with scoped binary episodic memory"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.42", features = ["bundled"] }
ciborium = "0.2"
zstd = "0.13"
sha2 = "0.10"
ureq = { version = "3.5", features = ["json", "rustls"] }
libc = "0.2"
tree-sitter = "0.25"
tree-sitter-php = "0.25.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.24.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-bash = "0.25.1"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-lua = "0.5.0"
tree-sitter-zig = "1.1.2"
tree-sitter-elixir = "0.3.5"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
