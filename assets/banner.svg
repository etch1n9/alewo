<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Alewo — Independent Rust Coding-Agent Harness and Universal Experience Engine">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#111A30"/>
      <stop offset="100%" stop-color="#1A162B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="72%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#334155" stroke-opacity="0.65" stroke-width="1.5"/>

  <!-- Subtle architectural node graph on the right -->
  <g stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5" fill="none">
    <line x1="870" y1="88" x2="970" y2="145"/>
    <line x1="870" y1="220" x2="970" y2="145"/>
    <line x1="970" y1="145" x2="1085" y2="105"/>
    <line x1="970" y1="145" x2="1085" y2="215"/>
    <line x1="1085" y1="105" x2="1085" y2="215"/>
  </g>
  <g>
    <circle cx="870" cy="88" r="10" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
    <circle cx="870" cy="220" r="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="970" cy="145" r="14" fill="#0F172A" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="1085" cy="105" r="9" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="1085" cy="215" r="9" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
    <text x="870" y="66" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">AGENT A</text>
    <text x="870" y="248" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">PEER B</text>
    <text x="970" y="182" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">CTRL</text>
    <text x="1085" y="84" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">VAULT</text>
    <text x="1085" y="242" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">E1-E3</text>
  </g>

  <!-- Brand title & tagline -->
  <rect x="64" y="58" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="132" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">ALEWO</text>
  <text x="64" y="174" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">Independent Rust Coding-Agent Harness &amp; Universal Experience Engine</text>
  <text x="64" y="206" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Evidence-led investigation • Two-agent skeptical deliberation • SQLite episodic vault • Sandboxed verification</text>

  <!-- Crisp built-in status pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
    <rect x="64" y="236" width="132" height="28" rx="6" fill="#1E293B" stroke="#F97316" stroke-opacity="0.7"/>
    <text x="130" y="254" text-anchor="middle" fill="#FDBA74">Rust Edition 2021</text>

    <rect x="208" y="236" width="132" height="28" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.7"/>
    <text x="274" y="254" text-anchor="middle" fill="#7DD3FC">25 Rust Modules</text>

    <rect x="352" y="236" width="148" height="28" rx="6" fill="#1E293B" stroke="#34D399" stroke-opacity="0.7"/>
    <text x="426" y="254" text-anchor="middle" fill="#6EE7B7">19 Tree-sitter AST</text>

    <rect x="512" y="236" width="104" height="28" rx="6" fill="#1E293B" stroke="#94A3B8" stroke-opacity="0.6"/>
    <text x="564" y="254" text-anchor="middle" fill="#CBD5E1">MIT License</text>
  </g>
</svg>
